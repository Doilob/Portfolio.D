<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Detail - THE PORTFOLIO GAZETTE</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="gazette-container">
    <!-- 헤더 -->
    <header class="gazette-header">
      <nav class="top-nav">
        <a href="index.html" class="back-link">&larr; Back to Front Page</a>
        <a href="admin.html">ADMIN PANEL</a>
      </nav>
      <h1 class="main-title">THE PORTFOLIO GAZETTE</h1>
      <div class="header-meta-bar">
        <span>FEATURED ARTICLE</span>
        <span>SPECIAL EDITION</span>
      </div>
    </header>

    <!-- 메인 상세 영역 -->
    <main class="detail-main">
      <!-- 프로젝트 동적 수록 컨테이너 -->
      <section id="project-detail-container">
        <!-- js/detail.js 에서 동적 렌더링 -->
      </section>

      <!-- 이전글 / 다음글 동적 네비게이션 영역 -->
      <section id="article-nav-section" class="article-nav-section">
      </section>

      <!-- 연관 프로젝트 추천 영역 -->
      <section id="related-section" class="related-section">
        <div class="related-section-title">RELATED ARTICLES</div>
        <div id="related-grid" class="related-grid">
        </div>
      </section>

      <!-- 💬 Giscus 댓글 섹션 -->
      <section class="gazette-comments-section">
        <script src="https://giscus.app/client.js"
                data-repo="본인계정/저장소이름"
                data-repo-id="R_kgDO..."
                data-category="Announcements"
                data-category-id="DIC_kwDO..."
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="preferred_color_scheme"
                data-lang="ko"
                crossorigin="anonymous"
                async>
        </script>
      </section>
    </main>

    <!-- 푸터 -->
    <footer class="gazette-footer">
      <p>© THE PORTFOLIO GAZETTE — ALL RIGHTS RESERVED.</p>
    </footer>
  </div>

  <!-- 공통 및 전역 스크립트 연결 -->
  <script src="js/auth-guard.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
