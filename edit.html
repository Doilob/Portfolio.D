<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Article - THE PORTFOLIO GAZETTE</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="gazette-container">
    <header class="gazette-header">
      <nav class="top-nav">
        <a href="admin.html" class="back-link">&larr; Back to Admin Panel</a>
      </nav>
      <h1 class="main-title edit-title">EDIT ARTICLE</h1>
      <div class="header-meta-bar">
        <span>ARTICLE EDITOR</span>
        <span>MARKDOWN SUPPORTED</span>
      </div>
    </header>

    <main class="edit-main">
      <section class="edit-card">
        <form id="edit-project-form">
          <!-- 1. 기사 타이틀 -->
          <div class="form-group">
            <label for="p-title" class="form-label">Article Title</label>
            <input type="text" id="p-title" class="form-input" required placeholder="프로젝트 제목">
          </div>

          <!-- 2. 상단 중요 정보 가로 그리드 박스 -->
          <div class="quick-meta-box">
            <span class="quick-meta-title">📌 QUICK META EDIT</span>
            
            <div class="form-grid-2">
              <div class="form-group grid-mb-clear">
                <label for="p-status" class="form-label">Status</label>
                <select id="p-status" class="form-select">
                  <option value="IN PROGRESS">IN PROGRESS (진행중)</option>
                  <option value="COMPLETED">COMPLETED (완료)</option>
                  <option value="DROPPED">DROPPED (폐기)</option>
                </select>
              </div>

              <div class="form-group grid-mb-clear">
                <label for="p-tag" class="form-label">Badge Tag</label>
                <input type="text" id="p-tag" class="form-input" placeholder="예: BRANDING, WEB">
              </div>
            </div>

            <div class="form-grid-2 grid-mb-clear">
              <div class="form-group grid-mb-clear">
                <label for="p-author" class="form-label">Author / Byline</label>
                <input type="text" id="p-author" class="form-input" placeholder="by Author Name">
              </div>

              <div class="form-group grid-mb-clear">
                <label for="p-date" class="form-label">Publication Date</label>
                <input type="text" id="p-date" class="form-input" placeholder="Sep 26, 2026">
              </div>
            </div>
          </div>

          <!-- 3. 헤드라인 요약 -->
          <div class="form-group">
            <label for="p-headline" class="form-label">Headline / Subtitle</label>
            <input type="text" id="p-headline" class="form-input" required placeholder="기사 한 줄 요약 헤드라인">
          </div>

          <!-- 4. 커버 이미지 변경 -->
          <div class="form-group">
            <label for="p-image-file" class="form-label">Update Cover Image (Optional)</label>
            <div class="image-preview-container">
              <img id="preview-image" class="image-preview" src="" alt="Current Image">
            </div>
            <input type="file" id="p-image-file" class="form-file-input" accept="image/*">
            <small class="form-help-text">새 이미지를 첨부하지 않으면 기존 이미지가 유지됩니다.</small>
          </div>

          <!-- 5. 📝 마크다운 에디터 & 라이브 프리뷰 영역 -->
          <div class="form-group">
            <div class="editor-header-bar">
              <label for="p-summary" class="form-label">Summary & Article Body (Markdown)</label>
              
              <!-- 탭 버튼 -->
              <div class="editor-mode-tabs">
                <button type="button" id="btn-mode-write" class="btn btn-tab btn-tab-active">✍️ Write</button>
                <button type="button" id="btn-mode-preview" class="btn btn-tab btn-tab-inactive">👁️ Preview</button>
              </div>
            </div>

            <!-- 마크다운 툴바 -->
            <div id="md-toolbar" class="md-toolbar">
              <button type="button" class="btn md-toolbar-btn" data-md="bold" title="Bold"><b>B</b></button>
              <button type="button" class="btn md-toolbar-btn" data-md="italic" title="Italic"><i>I</i></button>
              <button type="button" class="btn md-toolbar-btn" data-md="h1" title="Header 1">H1</button>
              <button type="button" class="btn md-toolbar-btn" data-md="h2" title="Header 2">H2</button>
              <button type="button" class="btn md-toolbar-btn" data-md="quote" title="Quote">”</button>
              <button type="button" class="btn md-toolbar-btn" data-md="list" title="List">• List</button>
              <button type="button" class="btn md-toolbar-btn" data-md="link" title="Link">🔗 Link</button>
            </div>

            <!-- 본문 입력창 -->
            <textarea id="p-summary" class="form-textarea md-textarea" rows="12" required placeholder="마크다운 문법으로 기사 내용을 작성하세요..."></textarea>

            <!-- 라이브 프리뷰 창 -->
            <div id="md-preview" class="md-preview-box"></div>
          </div>

          <div class="form-btn-group">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="admin.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="gazette-footer">
      <p>© THE PORTFOLIO GAZETTE — ALL RIGHTS RESERVED.</p>
    </footer>
  </div>

  <script src="js/auth-guard.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
