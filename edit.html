<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Project - THE PORTFOLIO GAZETTE</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="gazette-container">
    <header class="gazette-header">
      <nav class="top-nav">
        <a href="admin.html" class="back-link">&larr; Back to Admin Manager</a>
      </nav>
      <h1 class="main-title edit-title">EDIT PROJECT ENTRY</h1>
    </header>

    <main class="admin-main edit-main">
      <section class="admin-card edit-card">
        <h2 class="edit-card-title">✏️ Modify Project Details</h2>
        <form id="edit-project-form" class="admin-form">
          <input type="hidden" id="p-id">
          
          <div class="form-group">
            <label for="p-title" class="form-label">Project Title</label>
            <input type="text" id="p-title" class="form-input" required>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="p-status" class="form-label">Status</label>
              <select id="p-status" class="form-select">
                <option value="IN PROGRESS">IN PROGRESS (진행중)</option>
                <option value="COMPLETED">COMPLETED (완료)</option>
                <option value="DROPPED">DROPPED (폐기)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="p-tag" class="form-label">Badge Tag</label>
              <input type="text" id="p-tag" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label for="p-headline" class="form-label">Headline</label>
            <input type="text" id="p-headline" class="form-input" required>
          </div>

          <div class="form-group">
            <label for="p-author" class="form-label">Author / Date Info</label>
            <input type="text" id="p-author" class="form-input">
          </div>

          <!-- Base64 파일 업로드 및 이미지 미리보기 영역 -->
          <div class="form-group">
            <label class="form-label">Current Image Preview</label>
            <div class="image-preview-container">
              <img id="current-image-preview" class="image-preview" src="" alt="Current Project Image">
            </div>
            
            <label for="p-image-file" class="form-label">Change Project Image File (Optional)</label>
            <input type="file" id="p-image-file" class="form-file-input" accept="image/*">
            <small class="form-help-text">새 이미지를 선택하지 않으면 기존 이미지가 그대로 유지됩니다.</small>
          </div>

          <div class="form-group">
            <label for="p-summary" class="form-label">Summary Description</label>
            <textarea id="p-summary" class="form-textarea" rows="4" required></textarea>
          </div>

          <div class="form-btn-group">
            <button type="submit" class="btn btn-primary">💾 Update Project</button>
            <a href="admin.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>
<!-- 기존 각 페이지 전용 JS 앞에 테마 스크립트 연결 -->
  <script src="js/theme.js"></script>
  <script src="js/auth-guard.js"></script> <!-- 👈 상단 보안 위젯 스크립트 추가 -->
  <script src="js/edit.js"></script>
</body>
</html>
