<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - THE PORTFOLIO GAZETTE</title>
  <!-- 기존 스타일 파일 연동 -->
  <link rel="stylesheet" href="styles/style.css">
  
  <!-- Google Fonts 연결 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="gazette-container">
    <!-- 상단 헤더 -->
    <header class="gazette-header">
      <nav class="top-nav">
        <a href="index.html">&larr; BACK TO MAIN GAZETTE</a>
      </nav>
      <h1 class="main-title" style="font-size: 2.2rem;">PROJECT MANAGER</h1>
      <div class="header-meta-bar">
        <span>ADMINISTRATION PANEL</span>
        <span>— THE PORTFOLIO GAZETTE —</span>
        <span>SECURE ACCESS</span>
      </div>
    </header>

    <main class="admin-main">
      <!-- 프로젝트 추가 카드 -->
      <section class="admin-card">
        <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 20px; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px;">➕ Add New Project</h2>
        <form id="project-form">
          <div class="form-group">
            <label>Project Title</label>
            <input type="text" id="p-title" required placeholder="예: 김세현의 취업">
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label>Status</label>
              <select id="p-status">
                <option value="IN PROGRESS">IN PROGRESS (진행중)</option>
                <option value="COMPLETED">COMPLETED (완료)</option>
                <option value="DROPPED">DROPPED (폐기)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Badge Tag</label>
              <input type="text" id="p-tag" placeholder="new / BRANDING / WEB">
            </div>
          </div>

          <div class="form-group">
            <label>Headline</label>
            <input type="text" id="p-headline" required placeholder="예: 와 김세현 뒤집어 놓았다">
          </div>

          <div class="form-group">
            <label>Author / Date Info</label>
            <input type="text" id="p-author" placeholder="예: by Sehyun, Kim / 2026.09.25 ~">
          </div>

          <!-- 기존 URL 입력 필드 대신 아래 파일 업로드 필드로 교체 -->
          <div class="form-group">
            <label for="p-image-file">Project Image File</label>
            <input type="file" id="p-image-file" accept="image/*" required>
            <small style="color: #666; font-size: 0.75rem;">이미지 파일(JPG, PNG, WEBP)을 업로드하면 자동으로 압축 변환되어 저장됩니다.</small>
          </div>

          <div class="form-group">
            <label>Summary Description</label>
            <textarea id="p-summary" rows="4" required placeholder="프로젝트 요약 내용을 입력하세요."></textarea>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn-black">💾 Save Project</button>
            <button type="button" id="export-json-btn" class="btn-orange">📥 Download projects.json</button>
            <!-- 🐙 본인의 깃허브 주소로 변경해 주세요 -->
            <a href="https://github.com/본인깃허브아이디/저장소이름/blob/main/projects.json" target="_blank" class="btn-github">🐙 GitHub 파일 수정하러 가기</a>
          </div>
        </form>
      </section>

      <!-- 기존 프로젝트 리스트 섹션 -->
      <section class="admin-card">
        <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 15px; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px;">📋 Archived Projects List</h2>
        <div id="admin-projects-list">
          <!-- js/admin.js가 리스트를 자동으로 채워줍니다 -->
        </div>
      </section>
    </main>

    <footer class="gazette-footer">
      <p>&copy; 2026 THE PORTFOLIO GAZETTE. ALL RIGHTS RESERVED.</p>
    </footer>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
