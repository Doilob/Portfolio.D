<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gazette Project Manager</title>
  <!-- styles 폴더 안에 있는 style.css를 올바르게 불러옵니다 -->
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="gazette-container">
    <header class="masthead">
      <nav class="nav-links">
        <a href="index.html">&larr; Back to Main Gazette</a>
      </nav>
      <h1 class="newspaper-title">PROJECT MANAGER</h1>
      <div class="masthead-bottom-border"></div>
    </header>

    <main class="admin-main">
      <section class="admin-card">
        <h2>➕ Add / Edit Project Entry</h2>
        <form id="project-form" class="admin-form">
          <div class="form-group">
            <label>Project Title (e.g. Project 4: Brand Redesign)</label>
            <input type="text" id="p-title" required placeholder="Project 4: New Venture">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Status (작업 상태)</label>
              <select id="p-status">
                <option value="IN PROGRESS">IN PROGRESS (주황색 - 진행중)</option>
                <option value="COMPLETED">COMPLETED (초록색 - 완료)</option>
                <option value="DROPPED">DROPPED (빨간색 - 폐기)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Badge Tag</label>
              <input type="text" id="p-tag" placeholder="BRANDING / EDITORIAL / WEB">
            </div>
          </div>

          <div class="form-group">
            <label>Headline (메인 헤드라인)</label>
            <input type="text" id="p-headline" required placeholder="Innovative User Experience">
          </div>

          <div class="form-group">
            <label>Author / Date</label>
            <input type="text" id="p-author" placeholder="by Sarah Jenkins | Sep. 2026">
          </div>

          <div class="form-group">
            <label>Image Name (이미지 파일명 또는 주소)</label>
            <input type="text" id="p-image" placeholder="project4.jpg">
          </div>

          <div class="form-group">
            <label>Summary Description (프로젝트 설명)</label>
            <textarea id="p-summary" rows="4" required placeholder="Write a brief overview..."></textarea>
          </div>

          <div class="btn-row">
            <button type="submit" class="admin-btn btn-save">💾 Save Project</button>
            <button type="button" id="export-json-btn" class="admin-btn btn-export">📥 Download projects.json</button>
            <button type="button" id="reset-btn" class="admin-btn btn-reset">↺ Reset to Default</button>
          </div>
        </form>
      </section>

      <section class="admin-card" style="margin-top: 30px;">
        <h2>📋 Current Projects List</h2>
        <div id="admin-projects-list" class="admin-list"></div>
      </section>
    </main>
  </div>

  <script>
    const defaultProjects = [
      {
        id: "proj-1",
        title: "Project 1: Redesigning a Global Brand",
        status: "IN PROGRESS",
        headline: "Revolutionizing Visual Identity",
        author: "by Sarah Jenkins",
        date: "May, 2024 • Sep. 12, 2026",
        badgeTag: "BRANDING",
        image: "project1.jpg",
        summary: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
      },
      {
        id: "proj-2",
        title: "Project 2: Digital Editorial Platform",
        status: "DROPPED",
        headline: "Curating Stories for the Modern Reader",
        author: "by Sarah Jenkins",
        date: "Jan. 13, 2024",
        badgeTag: "EDITORIAL",
        image: "project2.jpg",
        summary: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
      },
      {
        id: "proj-3",
        title: "Project 3: Interactive Web Experience",
        status: "COMPLETED",
        headline: "Engaging Users Through Immersive Design",
        author: "by Sarah Jenkins",
        date: "May, 2024 • Sat. 15, 2024",
        badgeTag: "WEB",
        image: "project3.jpg",
        summary: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
      }
    ];

    function getStoredProjects() {
      const saved = localStorage.getItem('gazette_projects');
      return saved ? JSON.parse(saved) : defaultProjects;
    }

    function saveProjects(projects) {
      localStorage.setItem('gazette_projects', JSON.stringify(projects, null, 2));
      renderAdminList();
    }

    function renderAdminList() {
      const projects = getStoredProjects();
      const listEl = document.getElementById('admin-projects-list');
      listEl.innerHTML = '';

      projects.forEach((proj, idx) => {
        let statusBadgeClass = 'status-in-progress';
        if (proj.status === 'COMPLETED') statusBadgeClass = 'status-completed';
        if (proj.status === 'DROPPED') statusBadgeClass = 'status-dropped';

        const item = document.createElement('div');
        item.className = 'admin-project-item';
        item.innerHTML = `
          <div>
            <strong>${proj.title}</strong> 
            <span class="status-badge ${statusBadgeClass}">${proj.status}</span>
            <p class="item-sub">${proj.headline}</p>
          </div>
          <button class="btn-delete" onclick="deleteProject(${idx})">🗑 Delete</button>
        `;
        listEl.appendChild(item);
      });
    }

    document.getElementById('project-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const projects = getStoredProjects();
      const newProj = {
        id: 'proj-' + Date.now(),
        title: document.getElementById('p-title').value,
        status: document.getElementById('p-status').value,
        badgeTag: document.getElementById('p-tag').value || 'PROJECT',
        headline: document.getElementById('p-headline').value,
        author: document.getElementById('p-author').value || 'by Author',
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }),
        image: document.getElementById('p-image').value || 'project.jpg',
        summary: document.getElementById('p-summary'>value
      };

      projects.unshift(newProj);
      saveProjects(projects);
      this.reset();
      alert('Project saved successfully!');
    });

    window.deleteProject = function(index) {
      if (confirm('Are you sure you want to delete this project?')) {
        const projects = getStoredProjects();
        projects.splice(index, 1);
        saveProjects(projects);
      }
    };

    document.getElementById('export-json-btn').addEventListener('click', function() {
      const projects = getStoredProjects();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "projects.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.getElementById('reset-btn').addEventListener('click', function() {
      if (confirm('Reset all projects to initial default list?')) {
        saveProjects(defaultProjects);
      }
    });

    renderAdminList();
  </script>
</body>
</html>
