<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Manager - THE PORTFOLIO GAZETTE</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="gazette-container">
    <header class="gazette-header">
      <nav class="top-nav">
        <a href="index.html" class="back-link">&larr; Back to Main Archive</a>
      </nav>
      
      <!-- 상단 제목 및 토큰 인증 버튼 영역 -->
      <div class="admin-auth-header">
        <h1 class="main-title">ADMIN MANAGER</h1>
        <div class="auth-btn-wrapper">
          <button type="button" id="auth-lock-btn" class="btn btn-primary">
            🔒 토큰 인증하기
          </button>
          <span id="auth-status-badge" class="badge auth-status-inactive">
            인증 필요
          </span>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <!-- 프로젝트 추가 카드 -->
      <section class="admin-card">
        <h2 class="edit-card-title">➕ Add New Project</h2>

        <form id="project-form" class="admin-form">
          <div class="form-group">
            <label for="p-title" class="form-label">Project Title</label>
            <input type="text" id="p-title" class="form-input" required placeholder="예: Project 1: Brand Redesign">
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="p-status" class="form-label">Status</label>
              <select id="p-status" class="form-select">
                <option value="IN PROGRESS">IN PROGRESS (진행중)</option>
                <option value="COMPLETED">COMPLETED (완료)</option>
                <option value="DROPPED">DROPPED (폐기)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="p-tag" class="form-label">Badge Tag</label>
              <input type="text" id="p-tag" class="form-input" placeholder="예: BRANDING, WEB">
            </div>
          </div>

          <div class="form-group">
            <label for="p-headline" class="form-label">Headline</label>
            <input type="text" id="p-headline" class="form-input" required placeholder="한 줄 요약 제목">
          </div>

          <div class="form-group">
            <label for="p-author" class="form-label">Author / Date Info</label>
            <input type="text" id="p-author" class="form-input" placeholder="by Author Name">
          </div>

          <!-- Base64 자동 압축 파일 업로드 필드 -->
          <div class="form-group">
            <label for="p-image-file" class="form-label">Project Image File</label>
            <input type="file" id="p-image-file" class="form-file-input" accept="image/*" required>
            <small class="form-help-text">이미지 파일(JPG, PNG, WEBP)을 업로드하면 자동으로 압축 변환되어 Gist에 저장됩니다.</small>
          </div>

          <div class="form-group">
            <label for="p-summary" class="form-label">Summary Description</label>
            <textarea id="p-summary" class="form-textarea" rows="4" required placeholder="상세 본문 내용을 입력하세요."></textarea>
          </div>

          <div class="form-btn-group">
            <button type="submit" class="btn btn-primary">💾 Save Project</button>
            <button type="button" id="export-json-btn" class="btn btn-secondary">📥 Export JSON Backup</button>
          </div>
        </form>
      </section>

      <!-- 등록된 프로젝트 목록 카드 -->
      <section class="admin-card">
        <h2 class="edit-card-title">📁 Project Archive List</h2>
        <div id="admin-projects-list">
          <!-- js/admin.js 에서 동적 렌더링 -->
        </div>
      </section>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
